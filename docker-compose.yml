services:
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-service:
    build: ./catalog-service
    environment:
      DATABASE_URL: postgresql://catalog:catalog@catalog-db:5432/catalog
    ports:
      - "8000:8000"
    depends_on:
      catalog-db:
        condition: service_healthy

volumes:
  catalog-db-data:
